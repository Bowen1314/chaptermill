# Publish the demo site. The site is built from run outputs committed under demo/
# (produced on a home server by a real catalog run), so the build needs no model,
# no audio and no secrets. Tests run first; a failed build publishes nothing.
name: Demo site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (without faster-whisper; tests use fakes)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests (pure functions, Temporal time-skipping workflow tests, replay)
        run: python -m pytest -q

      - name: Build the site from demo/
        run: python scripts/build_site.py --demo demo --out _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
